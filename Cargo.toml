[workspace]
members = ["crates/hipercalc-core", "crates/hipercalc", "crates/hipercalc-gui"]
# `default-members`：裸 `cargo build` / `cargo test`（不带 -p / --workspace）只构建**出货的两个 crate**。
# 必要性：GUI 把 iced 拉进来后有 354 个包、首次编译约 5.5 分钟，而命令行要保持"秒级构建"；
# 不加这一行，CI 的 `cargo build` / `cargo test` / 6 目标交叉编译都会连带把 GUI 编一遍。
# 要构建 GUI 请显式写 `-p hipercalc-gui`（或其目录下 `cargo build`）。
default-members = ["crates/hipercalc-core", "crates/hipercalc"]
# 虚拟清单没有 edition；不显式写会回退 resolver=1 并告警
# （edition 2024 隐含 resolver 3）
resolver = "3"

[workspace.dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
colored = "2"
rustyline = "14"
# GUI 框架（仅 hipercalc-gui 使用）：Elm 架构（State/Message/View/Update）、声明式 widget。
# 0.14 是当前稳定版（需要 rustc ≥ 1.88）。
iced = "0.14"

# 桌面复制（Desktop Duplication）—— 仅 hipercalc-gui 用，且只在 Windows 上
# 真正链接。用来取代 GDI 的"从屏幕 DC 回读桌面"（实测 65–90ms/次，
# 背景最快只能 2fps）。这个 API 拿的是 GPU 侧的桌面帧，桌面没变化时轮询
# 一次约 0.1ms，有变化时再把画面在 GPU 上缩到 1/2 或 1/8 才回读（3–5ms）。
#
# ⚠️ 版本必须跟 iced/wgpu 依赖树里的那份对齐（见 Cargo.lock），
# 避免重复编译两份 `windows`。
windows = "0.62"

# 异步原语（仅 hipercalc-gui 使用）：后台求值用 `oneshot` 把结果**非阻塞**地
# 回传给 iced 的 task future（见 `src/evaluator.rs`）。
#
# ⚠️ **不要**把这里换成"在 future 里阻塞等 `std::sync::mpsc`" —— 那样虽然也能跑，
# 但会占住 iced 线程池的一条线程；`oneshot` 是真正的事件驱动等待，不占线程。
# iced 自己就依赖 `futures`，所以这条不增加任何编译量。
futures = "0.3"

# debug 构建下仅对第三方依赖开启优化：
# 本项目源码保持 opt-level 0（断点/变量查看不受影响），但 num-bigint / num-rational
# 等大数库的乘除、取模、进制转换在 opt-level 0 下慢一个数量级以上，
# 是方程求解等重计算在 debug 下耗时数十秒的主因。
#
# 注意：`[profile.*]` 只认 **workspace 根**的清单；写在成员包里会被忽略并告警。
[profile.dev.package."*"]
opt-level = 3
