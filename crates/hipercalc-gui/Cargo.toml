[package]
name = "hipercalc-gui"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "HiPerCalc 图形界面（Iced）"
license = "MIT"
repository = "https://github.com/EasonZYQ/high_precision_calc"
publish = false

# lib + bin 双形态：界面实现放库里，`tests/` 才能驱动它做快照与交互测试；
# bin 只负责起 iced 事件循环。
[lib]
name = "hipercalc_gui"
path = "src/lib.rs"

[[bin]]
name = "hipercalc-gui"
path = "src/main.rs"

[dependencies]
# ⚠️ **必须放在通用依赖里**：它曾被误写在 `[target.'cfg(windows)'.dependencies]` 段，
# 于是 macOS / Linux 上 `usize futures` 解析不到 —— GUI 从来没在非 Windows 编译过，
# 一直到 v2.0.0 发布时才被 macOS 构建撞出来（evaluator.rs: E0433 cannot find crate `futures`）。
futures = { workspace = true }
# 数值底座：GUI 里显示/计算的一切高精度数值都从这里来。
hipercalc-core = { path = "../hipercalc-core", version = "0.1" }

# 求值会话：`Session` 把 CLI 的求值能力包成公开 API（见 crates/hipercalc/src/session.rs），
# 于是 GUI 与命令行走**同一条求值路径**，结果必然一致。
hipercalc = { path = "../hipercalc", version = "2.0.0" }

# GUI 框架。用默认 feature 集（wgpu 渲染 + tiny-skia 软件兜底 + crisp 文字）。
#
# 额外开 `canvas`：根号必须用**矢量路径**画（√ 字符的字形顶钩够不到顶线，
# 字符 + 顶线的组合在视觉上「上下分离」，见 `mathrender.rs` 的 `Radical`）。
# canvas 不在 iced 的默认 feature 里，所以要显式打开。
# `tokio` 不是给业务用的，只为打开 `iced::time::every` —— 计算中的秒表靠它。
# 它本来就在依赖树里（iced 的窗口后端要用），所以几乎不增加编译量。
# `advanced` 是为了自绘窗口栏：缩放热区要直接实现 `iced::advanced::Widget`，
# 才能上报 `mouse::Interaction`（贴边时变成 ↔ 光标）。纯 widget 组合做不到这点。
iced = { workspace = true, features = ["image", "canvas", "tokio", "advanced"] }

# 桌面复制（Desktop Duplication）：**只有 Windows 需要**，所以放在
# `[target.'cfg(windows)'.dependencies]` —— 否则 Linux / macOS 的 CI 也要
# 去编译这套 Win32 绑定（而且那两个平台上根本用不到）。
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # `DXGI_OUTPUT_DESC` 里带了 `HMONITOR`，所以还要 Gdi
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# `oneshot` 通道：后台求值线程算完后用它把结果**非阻塞**地交给 iced 的 task future。
#
# ⚠️ 这是"界面永不卡死"的关键一环。早期版本用的是「std mpsc + 自旋等待」，
# 而自旋那段代码被**误放进了 `update`**（`Task::perform` 的第一个参数收的是
# 已构造好的 future，不是产生 future 的闭包 —— 见 `evaluator.rs` 模块头的说明），
# 结果 UI 线程照样被按住，大输入依然「未响应」。

[dev-dependencies]
# 离屏（headless）渲染 + 快照：用来在**没有显示器**的环境里验证界面长什么样，
# 并把 PNG 存进 tests/snapshots/ 作为视觉基线。这是本项目"截图验证"的主力手段 ——
# 系统级的抓屏（PowerShell + System.Drawing）在本机受限，靠不住。
iced_test = "0.14"

# iced 内部就是用它解析字体的，但没把它 re-export 出来。
# 我们在 `examples/fontprobe.rs` 与 `tests/fonts.rs` 里需要拿它核对
# "声明的字体族名真的能从打包字节里取到" —— 字体名写错会**静默**退回默认字体，
# 不主动验证根本发现不了，所以这条依赖是必要的。
# 版本跟 iced 依赖树里那份（见 Cargo.lock）对齐，避免重复编译两份。
fontdb = "0.23"
