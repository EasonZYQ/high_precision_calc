[package]
name = "hipercalc-gui"
version = "1.3.0"
edition = "2024"
rust-version = "1.88"
description = "HiPerCalc 图形界面（Iced）"
license = "MIT"
repository = "https://github.com/EasonZYQ/high_precision_calc"
publish = false

[dependencies]
# 数值底座：GUI 里显示/计算的一切高精度数值都从这里来。
# 注意：解析器与求解器在 `hipercalc` 里，但它目前只导出 `run()`（整个 REPL），
# 还不能被 GUI 复用 —— 等正式开工时先把它的求值入口暴露成公开 API，再在这里加依赖。
hipercalc-core = { path = "../hipercalc-core", version = "0.1" }

# GUI 框架。用默认 feature 集（wgpu 渲染 + tiny-skia 软件兜底 + crisp 文字）。
iced.workspace = true
