[package]
# 包名必须保持 hipercalc：CI 的冒烟测试与 release 的产物名都按 `hipercalc(.exe)` 引用，
# 改名会牵动 ci.yml 与 release.yml 的多处路径。
name = "hipercalc"
version = "1.2.1"
edition = "2024"
description = "超高精度命令行计算器"
license = "MIT"
repository = "https://github.com/EasonZYQ/high_precision_calc"

[dependencies]
hipercalc-core = { path = "../hipercalc-core", version = "0.1" }
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
num-integer.workspace = true
colored.workspace = true
rustyline.workspace = true
