name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ⚠️ **GUI 必须单独 check**（2026-10-22 加的）：
  # 根 `Cargo.toml` 的 `default-members` 只有 core+cli，所以上面的 `cargo build/test`
  # **根本不编译 hipercalc-gui** —— 曾出现"CI 全绿但 GUI 编译不过"整整半小时没被发现
  #（`backdrop.rs` 误删了几个函数）。这条 job 只做 `cargo check`，很快。
  gui:
    name: Check GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ⚠️ **两个平台都查**：GUI 的依赖声明曾把 `futures` 写进 windows-only 段，
    # 只有 Windows 能编 —— macOS 一直编不过却没人发现（v2.0.0 发布时才炸）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui

      - name: Check hipercalc-gui (all targets)
        run: cargo check -p hipercalc-gui --all-targets

      # **GUI 的逻辑测试也要进 CI**（2026-10-26 加）。
      #
      # 之前这条 job 只 `check`：GUI 的 149 个 lib 测试（结构化输入、式子编辑、
      # 键盘映射、主题/字体选择、背景填充……）**从来没在 CI 跑过** —— 本地忘了跑
      # 就能把行为改坏而 CI 全绿。这些测试不碰 wgpu、不建窗口，跑完约 1 秒。
      #
      # ⚠️ 只在 Windows 跑：macOS runner 排队严重（本次实测多次被 cancelled），
      # 而这条链路（MathIO 解析 / 槽位光标 / 填充数学）本来就与平台无关；
      # 真正要 GPU 的快照测试（17 张）仍然只在本地跑，见 `tests/snapshot.rs` 的说明。
      - name: Test hipercalc-gui (lib)
        if: runner.os == 'Windows'
        run: cargo test -p hipercalc-gui --lib

      # GUI 的 clippy 也一起卡住（2026-10-26 起该 crate 零告警）。
      # Lint job 跑在 ubuntu 且不带 --workspace，覆盖不到 GUI —— 只能在这里补。
      - name: Clippy hipercalc-gui (warnings are blocking)
        if: runner.os == 'Windows'
        run: cargo clippy -p hipercalc-gui --all-targets -- -D warnings

  # 三平台跑构建 + 单元测试
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: printf '1+2*3\nprimefac(360)\n/exit\n' | ./target/debug/hipercalc -q

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"1+2*3", "primefac(360)", "/exit" | ./target/debug/hipercalc.exe -q'

  # 覆盖 Release 要出的全部目标：**跨平台编译一旦坏掉，这里就会红**
  # （早期 rawkey::Key 变体缺失导致非 Windows 全线失败，正是这一层能提前拦住的）
  # 代码风格与静态检查：只跑一次 Ubuntu（fmt/clippy 结果与平台无关，不必进三平台矩阵）
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # fmt：仓库已做过一次全仓格式化（见 style 提交），这里**阻塞**
      - name: Rustfmt check
        run: cargo fmt --all -- --check

      # clippy：**2026-10-26 起零告警**（core 22 + cli 8 + gui 2 已全部清掉），
      # 所以这里从"只拦 correctness"收紧成 `-D warnings` —— 新增任何一条告警
      # 都会让 CI 变红。依赖升级带来的误报如果确实无法避免，再针对性地
      # `#[allow(…, reason=…)]`，不要整体回退这一行。
      #
      # 这里**刻意不带 `--workspace`**：`--workspace` 会把 hipercalc-gui 一起拉进来，
      # 而 GUI 的依赖树（iced → wgpu / naga / winit）有 354 个包、且尚未纳入 CI。
      # 不带 --workspace 时按 `default-members` 走，即两个出货 crate。
      # 等 GUI 正式开工，再单开一个 job 覆盖它（含 Linux 系统依赖）。
      - name: Clippy (warnings are blocking)
        run: cargo clippy --all-targets -- -D warnings

  cross:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # ⚠️ **必须显式给**：macOS 交叉构建在冷缓存 + runner 容量紧张时会跑到 15 分钟
    # 以上（实测 15m1s / 15m38s 被掐断，表现为"job 失败但其实代码没问题"）。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compile deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
