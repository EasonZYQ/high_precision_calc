name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compile deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../hipercalc-${{ matrix.target }}.tar.gz hipercalc

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path hipercalc.exe -DestinationPath ../../../hipercalc-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hipercalc-${{ matrix.target }}
          path: hipercalc-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 每次发布都带**中英双语**说明（下方表头 + 中英文正文），不要只写一种语言
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: HiPerCalc ${{ github.ref_name }}
          body: |
            ## 中文

            各平台二进制见下方 Assets：

            | 平台 | 文件 |
            |---|---|
            | Windows x86_64 | `hipercalc-x86_64-pc-windows-msvc.zip` |
            | Linux x86_64 (glibc) | `hipercalc-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux x86_64 (musl，静态) | `hipercalc-x86_64-unknown-linux-musl.tar.gz` |
            | Linux aarch64 | `hipercalc-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `hipercalc-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `hipercalc-aarch64-apple-darwin.tar.gz` |

            解压后直接运行 `hipercalc`（Windows 为 `hipercalc.exe`）；Linux / macOS 可能需要先
            `chmod +x hipercalc`。模块化的 musl 版本不依赖系统 glibc。

            - 完整文档：[docs/DOC.zh-CN.md](https://github.com/${{ github.repository }}/blob/main/docs/DOC.zh-CN.md)
            - 更新内容见下方自动生成的提交列表。

            ## English

            Per-platform binaries are attached below:

            | Platform | File |
            |---|---|
            | Windows x86_64 | `hipercalc-x86_64-pc-windows-msvc.zip` |
            | Linux x86_64 (glibc) | `hipercalc-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux x86_64 (musl, static) | `hipercalc-x86_64-unknown-linux-musl.tar.gz` |
            | Linux aarch64 | `hipercalc-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `hipercalc-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `hipercalc-aarch64-apple-darwin.tar.gz` |

            Unpack and run `hipercalc` (`hipercalc.exe` on Windows); on Linux / macOS you may need
            `chmod +x hipercalc` first. The musl build is statically linked and needs no system glibc.

            - Full documentation: [docs/DOC.en.md](https://github.com/${{ github.repository }}/blob/main/docs/DOC.en.md)
            - See the auto-generated commit list below for what changed.
          generate_release_notes: true
