name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: hipercalc.exe
            asset: hipercalc-x86_64-pc-windows-msvc.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: hipercalc
            asset: hipercalc-x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: hipercalc
            asset: hipercalc-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            bin: hipercalc
            asset: hipercalc-aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: hipercalc
            asset: hipercalc-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: hipercalc
            asset: hipercalc-aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compile deps (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p hipercalc

      # 直接发布**二进制本体**（不再打包 zip / tar.gz）：文件名即平台标识。
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # 图形界面：与 CLI 同一套产物流程。**只发 Windows 与 macOS** ——
  # Linux 的 GUI 需要 libxkbcommon / wayland / x11 等系统开发包，
  # 而且玻璃质感在非 Windows 上本来就退回"关闭"，先不占发布位置。
  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: hipercalc-gui.exe
            asset: hipercalc-gui-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: hipercalc-gui
            asset: hipercalc-gui-macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: hipercalc-gui
            asset: hipercalc-gui-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}

      # Linux 上 iced/winit 需要这些开发包才能编（xkbcommon / wayland / x11 / fontconfig）
      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxkbcommon-x11-0 \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libudev-dev

      - name: Build GUI
        run: cargo build --release --target ${{ matrix.target }} -p hipercalc-gui

      - name: Stage (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      - name: Stage (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: [build, gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 每次发布都带**中英双语**说明（下方表头 + 中英文正文），不要只写一种语言
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: HiPerCalc ${{ github.ref_name }}
          body: |
            ## 中文

            各平台**可执行文件本体**见下方 Assets（未压缩，下载后即可运行）：

            | 平台 | 文件 |
            |---|---|
            | Windows x86_64 | `hipercalc-x86_64-pc-windows-msvc.exe` |
            | Linux x86_64 (glibc) | `hipercalc-x86_64-unknown-linux-gnu` |
            | Linux x86_64 (musl，静态) | `hipercalc-x86_64-unknown-linux-musl` |
            | Linux aarch64 | `hipercalc-aarch64-unknown-linux-gnu` |
            | macOS Intel | `hipercalc-x86_64-apple-darwin` |
            | macOS Apple Silicon | `hipercalc-aarch64-apple-darwin` |

            **图形界面（GUI）**

            | 平台 | 文件 |
            |---|---|
            | Windows x86_64 | `hipercalc-gui-windows-x86_64.exe` |
            | macOS Apple Silicon | `hipercalc-gui-macos-aarch64` |
            | Linux x86_64 | `hipercalc-gui-linux-x86_64` |

            Linux 的 GUI 依赖系统库：`sudo apt install libxkbcommon-x11-0 libwayland-client0`（玻璃质感只在 Windows 可用，其它平台自动退回"关闭"）。

            **Linux / macOS 需要先加可执行位**（GitHub 不保留它）：

            ```bash
            chmod +x hipercalc-x86_64-unknown-linux-gnu
            ./hipercalc-x86_64-unknown-linux-gnu
            ```

            建议重命名为 `hipercalc` 后再用。musl 版本静态链接，不依赖系统 glibc。

            - 完整文档：[docs/DOC.zh-CN.md](https://github.com/${{ github.repository }}/blob/main/docs/DOC.zh-CN.md)
            - 更新内容见下方自动生成的提交列表。

            ## English

            Per-platform **raw executables** are attached below (no archives — download and run):

            | Platform | File |
            |---|---|
            | Windows x86_64 | `hipercalc-x86_64-pc-windows-msvc.exe` |
            | Linux x86_64 (glibc) | `hipercalc-x86_64-unknown-linux-gnu` |
            | Linux x86_64 (musl, static) | `hipercalc-x86_64-unknown-linux-musl` |
            | Linux aarch64 | `hipercalc-aarch64-unknown-linux-gnu` |
            | macOS Intel | `hipercalc-x86_64-apple-darwin` |
            | macOS Apple Silicon | `hipercalc-aarch64-apple-darwin` |

            **GUI builds**

            | Platform | File |
            |---|---|
            | Windows x86_64 | `hipercalc-gui-windows-x86_64.exe` |
            | macOS Apple Silicon | `hipercalc-gui-macos-aarch64` |
            | Linux x86_64 | `hipercalc-gui-linux-x86_64` |

            The Linux GUI needs `libxkbcommon-x11-0` and `libwayland-client0`. Glass texture is Windows-only; other platforms fall back to "off".

            **On Linux / macOS you must restore the executable bit first** (GitHub does not keep it):

            ```bash
            chmod +x hipercalc-x86_64-unknown-linux-gnu
            ./hipercalc-x86_64-unknown-linux-gnu
            ```

            Renaming it to `hipercalc` is recommended. The musl build is statically linked and needs no system glibc.

            - Full documentation: [docs/DOC.en.md](https://github.com/${{ github.repository }}/blob/main/docs/DOC.en.md)
            - See the auto-generated commit list below for what changed.
          generate_release_notes: true
